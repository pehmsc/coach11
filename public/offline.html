<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Coach11 offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #10b981;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 28rem);
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: rgba(16, 185, 129, 0.12);
        color: var(--accent);
        font-weight: 700;
        font-size: 18px;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 1.4rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .actions {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      .primary {
        background: #0f172a;
        color: white;
      }

      .secondary {
        background: white;
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">11</div>
      <h1>Sem ligação à internet</h1>
      <p>
        A Coach11 continua instalada, mas esta área precisa de rede para carregar dados
        atualizados e conteúdo autenticado em segurança.
      </p>
      <div class="actions">
        <button class="primary" type="button" id="retry">
          Tentar novamente
        </button>
        <a class="secondary" href="/dashboard">Voltar à app</a>
      </div>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
